name: behave

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./sounds:/app/sounds
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('data/behave.db').execute('SELECT 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
